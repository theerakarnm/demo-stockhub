services:
  postgres:
    image: postgres:16-alpine
    container_name: stockhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockhub
      POSTGRES_PASSWORD: stockhub
      POSTGRES_DB: stockhub
    ports:
      # 5432-5434 are taken by other projects on this machine (Homebrew
      # Postgres + podman containers). 5435 is the StockHub convention.
      - '5435:5432'
    volumes:
      - stockhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockhub -d stockhub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockhub-pgdata:
