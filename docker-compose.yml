services:
  postgres:
    image: postgres:16-alpine
    container_name: stockhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockhub
      POSTGRES_PASSWORD: stockhub
      POSTGRES_DB: stockhub
    ports:
      # 5432 is often taken by a local Postgres install; change the host port if so.
      - '5432:5432'
    volumes:
      - stockhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockhub -d stockhub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockhub-pgdata:
