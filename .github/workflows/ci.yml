# Quality gate for every push and pull request.
#
# Three jobs, in the shape of the three Wave 0 risks:
#   quality - typecheck, lint, unit tests (no database needed)
#   database - the generated migration applies, the seed runs twice, and the
#              database-level guards actually reject bad data
#   build - the web app compiles and both Workers bundle (workerd dry-run)
#
# The deploy job at the bottom runs only on main, after all three pass.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck / Lint / Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  database:
    name: Migration / Seed / DB guards
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockhub
          POSTGRES_PASSWORD: stockhub
          POSTGRES_DB: stockhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockhub -d stockhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stockhub:stockhub@localhost:5432/stockhub
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Apply generated migrations
        run: bun run db:migrate
      - name: Seed (second run proves the reset is idempotent)
        run: |
          bun run db:seed
          bun run db:seed
      - name: Database-backed integration tests (db + api)
        run: |
          bun test packages/db apps/api 2>&1 | tee test.log
          if grep -qE "^ *[1-9][0-9]* skip" test.log; then
            echo "DB-gated suites skipped although DATABASE_URL is set"; exit 1
          fi

  build:
    name: Web build + Workers dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Next.js build
        run: bun run --filter @stockhub/web build
      - name: API worker bundles for workerd
        run: bunx wrangler deploy --env staging --dry-run
        working-directory: apps/api
      - name: Runtime probe worker bundles for workerd
        run: bunx wrangler deploy --env staging --dry-run
        working-directory: apps/runtime-probe

  deploy-staging:
    name: Deploy Workers to staging
    needs: [quality, database, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The `secrets` context is not allowed in step-level `if`, so the token is
    # mapped into env once and the steps test `env.CLOUDFLARE_API_TOKEN`.
    # Requires two repo secrets (Settings > Secrets and variables > Actions):
    #   CLOUDFLARE_API_TOKEN   - token with Workers Scripts:Edit on this account
    #   CLOUDFLARE_ACCOUNT_ID  - cdb0cbb3e603d90a87211285391aaaef
    # Until both exist the deploy steps skip, and staging is deployed from a
    # laptop with `wrangler deploy --env staging` instead.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Deploy API worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bunx wrangler deploy --env staging
        working-directory: apps/api
      - name: Deploy runtime probe worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bunx wrangler deploy --env staging
        working-directory: apps/runtime-probe
      - name: Smoke test the staging API
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          curl --fail --silent --show-error https://stockhub-api-staging.theerakarnm.workers.dev/health
